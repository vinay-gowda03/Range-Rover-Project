<body>
    <h1>BOOKINGS OPEN</h1>
    <header>
        <nav>
            <ul>
                <li><a href="main.html">HOME</a></li>    
                <li><a href="#types">TYPES OF RANGE ROVER</a></li>
                <li><a href="evoque.html">EVOQUE RANGE ROVER</a></li>

                <li><a href="autobio.html">AUTOBIOGRAPHY RANGE ROVER</a></li>               
            </ul>
        </nav>
    </header><hr>
    <main>
        <form action="https://httpbin.org/get" method="get">
            <fieldset>
                <legend><strong>Book Now:</strong></legend>
                <p>
                    <label for="name">Name:</label>
                    <input type="text" name="name" id="name" placeholder="Enter name" required>
                </p>
                <p>
                    <label for="age">Age:</label>
                    <input type="number" name="age" id="age" placeholder="Enter age" required>
                </p>
                
                <p>
                    <label for="phone">Phone:</label>
                    <input type="text" name="number" id="number" placeholder="Enter Phone No."
                    required>
                </p>
                <p>
                    <label for="mail">Email:</label>
                    <input type="mail" name="mail" id="mail" placeholder="Enter mail" required>
                </p>
                <label for="gender">Gender:</label>
                <p>
                    <input type="radio" name="gender" id="male" value="male">
                    <label for="male">Male</label><br>
                    <input type="radio" name="gender" id="female" value="female">
                    <label for="female">Female</label><br>
                    <input type="radio" name="gender" id="other" value="other">
                    <label for="other">Other</label>
                </p>    
                <p>
                    <label for="car">CAR: </label>
                    <select name="car" id="car">
                        <optgroup label="EVOQUE">
                            <option value="red">Red</option>
                            <option value="white">White</option>
                            <option value="black">Black</option>
                        </optgroup>
                        <optgroup label="SPORT">
                            <option value="black">Black</option>
                            <option value="white">White</option>
                        </optgroup>
                            <optgroup label="AUTOBIOGRAPHY">
                            <option value="black">Black</option>
                            <option value="white">White</option>
                        </optgroup>
                    </select>
                </p>

                <p><label for="varient">VARIENTS:</label>

                    <input type="text" name="varient" id="varient" list="varient-list">
                    <datalist id="varient-list">
                        <option value="Low-Varient">
                        <option value="Middle-Varient">
                        <option value="High-Varient">
                        </optgroup>
                    </datalist>
            </fieldset>
            <button type="submit">Submit</button>
        </form>
    </main>
